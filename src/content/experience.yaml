# Keep this factual: no invented metrics, scale, team sizes or outcomes.
- id: inthera-consulting-group
  role: Backend Developer
  company: Inthera Consulting Group
  start: 2025
  end: null
  summary: >-
    I build backend features in Python and Django: REST APIs, the PostgreSQL
    data behind them, and integrations with other systems. Where a feature
    needs an interface, I work in React too.
  tools: [Python, Django, REST APIs, SQL, PostgreSQL, Docker, React]
  stack:
    intro: >-
      One request, from the interface to the database, with the backend
      running in Docker.
    layers:
      - id: react
        tier: Interface
        name: React
        detail: Frontend
        handoff: HTTP · JSON
        text: Where a feature needs an interface, I build it in React on top of the same APIs.
      - id: rest
        tier: API
        name: REST APIs
        detail: Integrations
        handoff: In process
        text: Endpoints for the frontend, and integrations that connect the backend to other systems.
      - id: django
        tier: Application
        name: Django
        detail: Python
        handoff: ORM · SQL
        text: The core of the work. Models, business logic and the views behind each endpoint, in Python.
      - id: postgres
        tier: Data
        name: PostgreSQL
        detail: SQL
        text: Relational data, reached through Django’s ORM and plain SQL.
    runtime:
      id: docker
      tier: Runtime
      name: Docker
      detail: Containers
      text: Packages the backend so it runs the same on every machine.
    runtimeWraps: [rest, django, postgres]
