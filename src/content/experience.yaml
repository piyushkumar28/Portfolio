# Keep this factual: no invented metrics, scale, team sizes or outcomes.
- id: inthera-consulting-group
  role: Backend Developer
  company: Inthera Consulting Group
  start: 2025
  end: null
  summary: >-
    I build backend features in Python and Django: REST APIs, the data behind
    them and integrations with other systems.
  tools: [Python, Django, REST APIs, SQL, PostgreSQL, Docker, React]
  system:
    nodes:
      - id: react
        name: React
        kind: Client
        text: Interfaces on top of the same APIs, where a feature needs one.
      - id: systems
        name: Other systems
        kind: External
        external: true
        text: Services the backend exchanges data with through its APIs.
      - id: rest
        name: REST APIs
        kind: Interface
        text: Endpoints for the frontend and integrations with other systems.
      - id: django
        name: Django
        kind: Framework
        text: "The core of the work: models, business logic and the views behind each endpoint."
      - id: python
        name: Python
        kind: Language
        text: What the whole backend is written in.
      - id: postgres
        name: PostgreSQL
        kind: Database
        text: Relational data, through Django’s ORM and plain SQL.
    container:
      id: docker
      name: Docker
      kind: Container
      text: Packages the backend so it runs the same on every machine.
      wraps: [rest, django, python]
    wires:
      - { from: react, to: rest, label: HTTP · JSON }
      - { from: systems, to: rest, label: integrations }
      - { from: rest, to: django, label: routing }
      - { from: django, to: postgres, label: ORM · SQL }
      - { from: python, to: django, label: runtime, flow: false }
    trace:
      - { path: [react, rest], step: Request, text: React calls an endpoint over HTTP. }
      - { path: [rest, django], step: Route, text: Django routes the request to a view. }
      - {
          path: [django, postgres],
          step: Query,
          text: The view reads and writes data through the ORM.,
        }
      - {
          path: [postgres, django],
          step: Result,
          text: Rows come back to the view as model objects.,
        }
      - {
          path: [django, rest, react],
          step: Response,
          text: The response goes back to the interface as JSON.,
        }
